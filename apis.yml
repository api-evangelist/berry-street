aid: berry-street
name: Berry Street
description: 'Berry Street is a telehealth platform that connects patients with board-certified,
  registered dietitians for virtual, insurance-covered nutrition therapy. Through 1-on-1 video
  sessions, patients receive medical nutrition therapy for 30+ conditions including eating
  disorders, diabetes, PCOS, IBS, gut health, heart disease, and prenatal and pediatric
  nutrition. Berry Street accepts 1,250+ insurance plans, matches patients to dietitians based
  on their needs, and offers an enterprise/employer offering for organizations. Backed by
  Northzone. This API Evangelist profile currently exposes no public developer or API surface;
  it is a company identity record enriched from Berry Street''s public web presence.'
